<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ふたりの家計簿</title>
<meta name="theme-color" content="#1d6a55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-column phone ledger. Summary on top, category rows below, fixed tab bar at the bottom */
  --bg:#eef2f0; --surface:#ffffff; --ink:#15201c; --muted:#5a6a64; --line:#d9e1dd;
  --accent:#1d6a55; --accent-soft:#dfeee7; --accent-ink:#ffffff;
  --warn:#a85a07; --bad:#b42318; --good:#1d7a4b;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1412; --surface:#172019; --ink:#e4ebe7; --muted:#97a69f; --line:#2a3631;
    --accent:#5cbf9c; --accent-soft:#1b302a; --accent-ink:#0b1512;
    --warn:#eea15a; --bad:#f08072; --good:#6fd09a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#172019; --ink:#e4ebe7; --muted:#97a69f; --line:#2a3631;
  --accent:#5cbf9c; --accent-soft:#1b302a; --accent-ink:#0b1512;
  --warn:#eea15a; --bad:#f08072; --good:#6fd09a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 92px)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h2{font-size:17px;font-weight:700}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.period{display:flex;align-items:center;justify-content:space-between;gap:8px}
.period .title{font-family:var(--font-display);font-weight:700;font-size:20px;text-align:center}
.period .range{font-size:12px;color:var(--muted);text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;font-size:18px}
.hero{display:grid;gap:4px}
.hero .big{font-family:var(--font-display);font-weight:900;font-size:36px;letter-spacing:-.01em;line-height:1.15}
.hero .big.neg{color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--bg);border-radius:10px;padding:8px}
.kv b{display:block;font-size:15px}
.kv span{font-size:11.5px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--bad)}
.cat{display:grid;gap:6px;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.cat:last-child{border-bottom:0}
.cat .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat .name{font-weight:700}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;vertical-align:2px;margin-left:6px}
.chip.gray{background:var(--bg);color:var(--muted)}
.left{font-size:12.5px}
.left.over{color:var(--bad);font-weight:700}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.people .p{background:var(--bg);border-radius:10px;padding:10px}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center;z-index:5}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%;align-items:end}
nav button{background:none;border:0;padding:6px 0;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
nav .plus{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 12px rgb(0 0 0 / .18)}
nav .plus svg{width:28px;height:28px}
/* input */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;min-height:64px;font-weight:700;font-size:14px;line-height:1.3}
.catbtn small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.catbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.amount{display:flex;align-items:center;gap:6px;border:2px solid var(--accent);border-radius:12px;padding:6px 12px;background:var(--surface)}
.amount input{border:0;outline:0;background:transparent;font-family:var(--font-display);font-weight:900;font-size:30px;width:100%;min-width:0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
label.f input,label.f select,.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;width:auto}
.photo{display:flex;gap:10px;align-items:center;justify-content:center;border:1.5px dashed var(--accent);border-radius:12px;padding:12px;color:var(--accent);font-weight:700;background:var(--surface);width:100%}
.cand{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
/* history */
.day{font-size:12.5px;color:var(--muted);font-weight:700;margin:6px 2px 2px}
.ent{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.ent .mid{flex:1;min-width:0}
.ent .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .amt{font-weight:700;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
/* report */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .val{fill:var(--ink);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
tr.proj td{color:var(--muted)}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.calc input{width:86px;text-align:right}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88%;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:30;max-width:92%}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:0;white-space:nowrap}
.setcat{display:grid;grid-template-columns:1fr 96px;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.setcat .opts{grid-column:1/-1;display:flex;gap:14px;font-size:13px;align-items:center;flex-wrap:wrap}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

nav[hidden]{display:none}
/* no pinch zoom; inputs at 16px so iPhone doesn't zoom in when one is focused */
html,body{touch-action:pan-x pan-y}
label.f input,label.f select,.field,.calc input,#pass{font-size:16px}
.periodbtn{background:none;border:0;padding:4px 8px;border-radius:10px;color:var(--ink)}
.periodbtn:active{background:var(--accent-soft)}
/* join screen */
.join{min-height:100%;display:grid;align-content:center;gap:16px;padding:24px 0}
.join h1{font-size:26px;font-weight:900}
.join .lead{color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:13.5px}
.showpw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.danger-zone{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
</style>
</head>
<body>
<main id="app"><p style="padding:40px 0;text-align:center;color:#5a6a64">読み込み中…</p></main>
<nav aria-label="メニュー" id="nav" hidden><div class="in" id="tabs"></div></nav>
<script>
  // iPhone: block pinch and double-tap zoom
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
</script>
<script src="firebase-config.js?v=4"></script>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
